name: cpmspro_workforce
description: CPMSPro Workforce - Premium staff/maintenance/technician mobile app for CPMSPro Commercial Property Management System.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Navigation
  go_router: ^14.2.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Media / device
  camera: ^0.10.6
  image_picker: ^1.1.2
  image: ^4.2.0
  mobile_scanner: ^5.1.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # In-app push: local-notification display only (see
  # core/notifications/push_notification_service.dart). No FCM/Firebase
  # wiring exists — firebase_core/firebase_messaging were declared but
  # never actually initialized or called anywhere, and no
  # google-services.json/GoogleService-Info.plist ships with the app, so
  # they were removed rather than left as a misleading "push works" claim.
  flutter_local_notifications: ^17.2.1

  # UI / UX
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  intl: 0.20.2
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1

  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5
  logger: ^2.3.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  sqflite_common_ffi: ^2.3.3
  flutter_secure_storage_platform_interface: ^1.1.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
