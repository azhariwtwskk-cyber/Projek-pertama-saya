<!doctype html>
<html lang="ms">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#173b73">
    <title>CPMS Offline</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#eef3f8;color:#10213c;font-family:Arial,sans-serif}
        main{width:min(100%,520px);padding:28px;border:1px solid #d9e2ec;border-radius:18px;background:#fff;box-shadow:0 16px 42px #0f172a18}
        .mark{width:64px;height:64px;display:grid;place-items:center;border-radius:16px;background:#f4c95d;color:#10213c;font-size:24px;font-weight:900}
        h1{margin:20px 0 10px}p{color:#52627a;line-height:1.65}
        button{width:100%;min-height:48px;border:0;border-radius:10px;background:#173b73;color:#fff;font-weight:800}
    </style>
</head>
<body>
<main>
    <div class="mark">CP</div>
    <h1>Tiada sambungan internet</h1>
    <p>CPMS tidak menyimpan dashboard atau data pengguna dalam cache. Sambungkan telefon kepada internet untuk membuka tugasan dan menghantar rekod baharu.</p>
    <button type="button" onclick="location.reload()">Cuba Semula</button>
</main>
</body>
</html>
